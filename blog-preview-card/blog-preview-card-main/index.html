<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style/style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body class="content">
    <div class="content__container">
      <div alt="image" class="content__image"></div>
      <div class="content__card">
        <div>
          <label for="" class="content__label text-present-3-bold"
            >Learning</label
          >
        </div>
        <p class="content__date text-present-3">Published 21 Dec 2023</p>
        <h1 class="content__title text-present-1">HTML & CSS foundations</h1>
        <p class="content__desc text-present-2">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>
      <div class="content__user">
        <img
          src="./assets/images/image-avatar.webp"
          alt=""
          class="content__user-image"
        />
        <p class="content__user-title text-present-3-bold">Greg Hooper</p>
      </div>
    </div>
  </body>
</html>
